<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WANTOPUP - Top Up Game Murah & Otomatis</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-cyan-400">WAN<span class="text-white">TOPUP</span></h1>
            <span class="text-xs bg-cyan-500/10 text-cyan-400 px-3 py-1 rounded-full border border-cyan-500/20 font-medium">Server Otomatis</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto p-4 sm:p-6 w-full my-6">
        
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
            <div class="border-b border-slate-800 pb-4">
                <h2 class="text-lg font-semibold text-slate-100">Top Up Mobile Legends</h2>
                <p class="text-xs text-slate-400">Masukkan Data Akun & Pilih Nominal Diamond</p>
            </div>

            <!-- Form Input Akun -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">User ID</label>
                    <input type="text" id="user_id" placeholder="Contoh: 12345678" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Zone ID (Server)</label>
                    <input type="text" id="zone_id" placeholder="Contoh: 1234" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500 transition">
                </div>
            </div>

            <!-- Pilihan Produk Diamond -->
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-2">Pilih Nominal</label>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    
                    <!-- Pilihan 1: 86 Diamond -->
                    <label class="cursor-pointer border border-slate-800 bg-slate-950 hover:border-cyan-500 rounded-xl p-3 flex flex-col justify-between transition group">
                        <input type="radio" name="product" value="ml_86" class="hidden peer" checked>
                        <span class="text-sm font-semibold text-slate-200 group-hover:text-cyan-400">86 Diamonds</span>
                        <span class="text-xs text-cyan-400 font-bold mt-2">Rp 20.000</span>
                    </label>

                    <!-- Pilihan 2: 172 Diamond -->
                    <label class="cursor-pointer border border-slate-800 bg-slate-950 hover:border-cyan-500 rounded-xl p-3 flex flex-col justify-between transition group">
                        <input type="radio" name="product" value="ml_172" class="hidden peer">
                        <span class="text-sm font-semibold text-slate-200 group-hover:text-cyan-400">172 Diamonds</span>
                        <span class="text-xs text-cyan-400 font-bold mt-2">Rp 40.000</span>
                    </label>

                    <!-- Pilihan 3: 257 Diamond -->
                    <label class="cursor-pointer border border-slate-800 bg-slate-950 hover:border-cyan-500 rounded-xl p-3 flex flex-col justify-between transition group">
                        <input type="radio" name="product" value="ml_257" class="hidden peer">
                        <span class="text-sm font-semibold text-slate-200 group-hover:text-cyan-400">257 Diamonds</span>
                        <span class="text-xs text-cyan-400 font-bold mt-2">Rp 60.000</span>
                    </label>

                </div>
            </div>

            <!-- Tombol Proses -->
            <button onclick="prosesTopUp()" id="btn-submit"
                class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg shadow-cyan-500/20 text-sm">
                Beli Sekarang
            </button>

            <!-- Area Status Response -->
            <div id="result-box" class="hidden bg-slate-950 border border-slate-800 p-4 rounded-xl text-xs space-y-1">
                <p class="font-semibold text-cyan-400">Status Transaksi:</p>
                <p id="result-text" class="text-slate-300 font-mono break-all"></p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-500 border-t border-slate-900">
        &copy; 2026 WANTOPUP. All rights reserved.
    </footer>

    <!-- JavaScript Penghubung ke Backend Vercel -->
    <script>
        async function prosesTopUp() {
            const userId = document.getElementById('user_id').value.trim();
            const zoneId = document.getElementById('zone_id').value.trim();
            
            // Mengambil produk yang dipilih user
            const selectedProduct = document.querySelector('input[name="product"]:checked');
            const productSku = selectedProduct ? selectedProduct.value : 'ml_86';

            const btnSubmit = document.getElementById('btn-submit');
            const resultBox = document.getElementById('result-box');
            const resultText = document.getElementById('result-text');

            // Validasi Input Sederhana
            if (!userId || !zoneId) {
                alert('Mohon masukkan User ID dan Zone ID dengan benar!');
                return;
            }

            // Ubah tombol jadi loading
            btnSubmit.disabled = true;
            btnSubmit.innerText = 'Memproses Pesanan...';
            resultBox.classList.add('hidden');

            try {
                // Mengirim data ke backend serverless di Vercel (/api/topup)
                const response = await fetch('/api/topup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, zoneId, productSku })
                });

                const result = await response.json();

                // Tampilkan hasil respon dari server
                resultBox.classList.remove('hidden');
                resultText.innerText = JSON.stringify(result, null, 2);

                if (response.ok) {
                    alert('Permintaan top-up berhasil dikirim ke server!');
                } else {
                    alert('Gagal memproses: ' + (result.message || 'Terjadi kesalahan'));
                }

            } catch (error) {
                resultBox.classList.remove('hidden');
                resultText.innerText = 'Error: ' + error.message;
                alert('Terjadi kesalahan koneksi ke server backend.');
            } finally {
                // Kembalikan tombol seperti semula
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'Beli Sekarang';
            }
        }
    </script>
</body>
</html>
